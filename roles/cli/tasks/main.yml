- name: "Copy .bashrc"
  ansible.builtin.copy:
    src: home/.bashrc
    dest: ~/.bashrc
    mode: "0644"

- name: "Copy tmux config"
  ansible.builtin.copy:
    src: home/.tmux.conf
    dest: ~/.tmux.conf
    mode: "0644"

- name: "Create vim bundle directory"
  ansible.builtin.file:
    state: directory
    path: ~/.vim/bundle
    mode: "0755"

- name: "Copy .vimrc"
  ansible.builtin.copy:
    src: home/.vimrc
    dest: ~/.vimrc
    mode: "0644"

- name: "Checkout YouCompleteMe" # noqa : latest
  ansible.builtin.git:
    dest: ~/.vim/bundle/YouCompleteMe
    repo: https://github.com/ycm-core/YouCompleteMe.git
    depth: 1
  notify: "Install YCM"

- name: "Create SSH config.d"
  ansible.builtin.file:
    state: directory
    path: ~/.ssh/config.d
    mode: "700"

- name: "Copy SSH Config"
  ansible.builtin.copy:
    src: home/.ssh/config
    dest: ~/.ssh/config
    mode: "600"
