- name: "Install Packages"
  become: true
  vars:
    cli_packages:
      Archlinux:
        - git
        - vim
        - tmux
        - task
        - xclip
        - glow
      Debian:
        - git
        - vim
        - tmux
        - taskwarrior
        - xclip
        - glow
  ansible.builtin.package:
    state: present
    name: "{{ cli_packages[ansible_facts['os_family']] }}"
