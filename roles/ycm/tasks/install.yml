- name: "Install YCM Build Requirements"
  become: true
  vars:
    ycm_packages:
      Archlinux:
        - gcc
        - cmake
        - python
      Debian:
        - gcc
        - g++
        - cmake
        - python3-dev
  ansible.builtin.package:
    state: present
    name: "{{ ycm_packages[ansible_facts['os_family']] }}"
