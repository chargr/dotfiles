- name: "Copy xinitrc"
  ansible.builtin.copy:
    src: home/.xinitrc
    dest: ~/.xinitrc
    mode: "0644"

- name: "Copy i3 config"
  ansible.builtin.copy:
    src: home/.config/i3/config
    dest: ~/.config/i3/config
    mode: "0644"

- name: "Copy Xresources"
  ansible.builtin.copy:
    src: home/.Xresources
    dest: ~/.Xresources
    mode: "0644"

- name: "Create alacritty config dir"
  ansible.builtin.file:
    state: directory
    path: ~/.config/alacritty
    mode: "0755"

- name: "Copy alacritty config"
  ansible.builtin.copy:
    src: home/.config/alacritty/alacritty.toml
    dest: ~/.config/alacritty/alacritty.toml
    mode: "0644"

- name: "Clone alacritty themes" # noqa : latest
  ansible.builtin.git:
    dest: ~/.config/alacritty/alacritty-theme
    repo: https://github.com/alacritty/alacritty-theme.git
    depth: 1
