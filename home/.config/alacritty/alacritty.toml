[general]
live_config_reload = true

import = [
    "~/.config/alacritty/alacritty-theme/themes/gruvbox_dark.toml"
]

[window]
opacity = 0.95

[font]
normal = { family = "Azeret Mono", style="SemiBold" }
bold = { style="SemiBold" }
italic = { style="SemiBold" }
bold_italic = { style="SemiBold" }
size = 10
offset.x =  0
offset.y = -2

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
